<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Principal</title>
  <style>
    body { font-family: sans-serif; background-color: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 30px; border-radius: 8px; text-align: center; border: 1px solid #334155; }
    button { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Bem-vindo ao Painel!</h1>
    <p id="userEmail">A carregar dados...</p>
    <button id="logoutBtn">Terminar Sessão</button>
  </div>

  <script type="module">
    import { auth } from './firebase-config.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const userEmail = document.getElementById('userEmail');
    const logoutBtn = document.getElementById('logoutBtn');

    // Verifica se o utilizador está autenticado
    onAuthStateChanged(auth, (user) => {
      if (user) {
        userEmail.textContent = `Sessão iniciada como: ${user.email}`;
      } else {
        // Se não estiver autenticado, volta para o login
        window.location.href = 'index.html';
      }
    });

    logoutBtn.addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = 'index.html';
    });
  </script>

</body>
</html>
