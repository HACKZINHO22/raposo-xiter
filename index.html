<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autenticação - Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #0f172a; color: #f8fafc; }
    .auth-container { background: #1e293b; border-radius: 12px; padding: 32px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); border: 1px solid #334155; }
    h2 { text-align: center; margin-bottom: 24px; color: #f1f5f9; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #94a3b8; }
    input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #334155; background-color: #0f172a; color: #fff; font-size: 14px; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #3b82f6; }
    .btn { width: 100%; padding: 12px; border-radius: 6px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; }
    .btn-primary { background-color: #2563eb; color: white; margin-bottom: 12px; }
    .btn-primary:hover { background-color: #1d4ed8; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary { background-color: transparent; color: #94a3b8; border: 1px solid #334155; }
    .btn-secondary:hover { background-color: #334155; color: #fff; }
    .message-box { margin-top: 16px; padding: 10px; border-radius: 6px; font-size: 13px; text-align: center; display: none; }
    .message-box.error { background-color: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
    .message-box.success { background-color: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
  </style>
</head>
<body>

  <div class="auth-container">
    <h2 id="formTitle">Iniciar Sessão</h2>
    
    <form id="authForm">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" required placeholder="exemplo@email.com">
      </div>

      <div class="form-group">
        <label for="password">Palavra-passe</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary">Entrar</button>
      <button type="button" id="toggleBtn" class="btn btn-secondary">Criar uma conta</button>
    </form>

    <div id="messageBox" class="message-box"></div>
  </div>

  <script type="module">
    import { auth } from './firebase-config.js';
    import { 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const authForm = document.getElementById('authForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const toggleBtn = document.getElementById('toggleBtn');
    const formTitle = document.getElementById('formTitle');
    const messageBox = document.getElementById('messageBox');

    let isLoginMode = true;

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = `message-box ${type}`;
      messageBox.style.display = 'block';
    }

    toggleBtn.addEventListener('click', () => {
      isLoginMode = !isLoginMode;
      formTitle.textContent = isLoginMode ? 'Iniciar Sessão' : 'Criar Conta';
      submitBtn.textContent = isLoginMode ? 'Entrar' : 'Cadastrar';
      toggleBtn.textContent = isLoginMode ? 'Criar uma conta' : 'Já tenho conta (Entrar)';
      messageBox.style.display = 'none';
    });

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value;
      const password = passwordInput.value;

      submitBtn.disabled = true;
      messageBox.style.display = 'none';

      try {
        if (isLoginMode) {
          await signInWithEmailAndPassword(auth, email, password);
          showMessage('Login efetuado! A redirecionar...', 'success');
        } else {
          await createUserWithEmailAndPassword(auth, email, password);
          showMessage('Conta criada! A redirecionar...', 'success');
        }
        
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1200);

      } catch (error) {
        let errorMsg = 'Erro na autenticação.';
        if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password') {
          errorMsg = 'E-mail ou palavra-passe incorretos.';
        } else if (error.code === 'auth/email-already-in-use') {
          errorMsg = 'Este e-mail já está em uso.';
        } else if (error.code === 'auth/weak-password') {
          errorMsg = 'A palavra-passe deve ter pelo menos 6 caracteres.';
        }
        showMessage(errorMsg, 'error');
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
