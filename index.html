<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAPOSO XITER — Autenticação & Gestão de Licenças</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex flex-col justify-between selection:bg-purple-500 selection:text-white">

  <!-- Glows de Fundo -->
  <div class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-7xl h-[500px] pointer-events-none -z-10">
    <div class="absolute top-[-100px] left-1/4 w-[400px] h-[400px] bg-purple-600/20 rounded-full blur-[120px]"></div>
    <div class="absolute top-[-50px] right-1/4 w-[350px] h-[350px] bg-blue-600/15 rounded-full blur-[100px]"></div>
  </div>

  <!-- Cabeçalho -->
  <header class="border-b border-slate-800/80 bg-[#0b0f19]/80 backdrop-blur-xl fixed w-full top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="#" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-pink-500 p-[1px] shadow-lg shadow-purple-500/20">
          <div class="w-full h-full bg-[#0d121f] rounded-[11px] flex items-center justify-center">
            <i class="fa-solid fa-shield-halved text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400 text-lg"></i>
          </div>
        </div>
        <span class="text-xl font-extrabold tracking-wide uppercase">
          RAPOSO <span class="bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">XITER</span>
        </span>
      </a>

      <button onclick="abrirModalAdmin()" class="relative group px-5 py-2.5 rounded-xl text-sm font-bold text-white overflow-hidden shadow-lg shadow-purple-600/25">
        <div class="absolute inset-0 bg-gradient-to-r from-purple-600 to-pink-600 transition-all duration-300 group-hover:opacity-90"></div>
        <span class="relative flex items-center gap-2">
          <i class="fa-solid fa-[#key] fa-key text-xs"></i> Painel Gerador
        </span>
      </button>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="pt-36 pb-20 px-6 max-w-6xl mx-auto text-center flex-1 flex flex-col justify-center items-center">
    
    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-purple-500/10 border border-purple-500/20 text-purple-300 text-xs font-semibold uppercase tracking-wider mb-8">
      <span class="w-2 h-2 rounded-full bg-purple-400 animate-pulse"></span>
      Validador de Licenças Ativo
    </div>

    <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight mb-6">
      Validar Licença <br/>
      <span class="bg-gradient-to-r from-purple-400 via-indigo-300 to-pink-500 bg-clip-text text-transparent">
        RAPOSO XITER
      </span>
    </h1>

    <!-- Validar Licença -->
    <div class="w-full max-w-md p-6 rounded-2xl bg-slate-900/60 border border-slate-800 backdrop-blur-xl shadow-2xl mb-12">
      <div class="flex flex-col gap-4">
        <div class="relative">
          <i class="fa-solid fa-key absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
          <input type="text" id="licenseKey" placeholder="Cole sua licença aqui" 
                 class="w-full pl-11 pr-4 py-3 bg-slate-950/80 border border-slate-800 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-purple-500 transition-colors text-sm">
        </div>
        <button onclick="validarChave()" class="w-full py-3 rounded-xl bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold text-sm shadow-lg shadow-purple-600/30 hover:scale-[1.02] active:scale-[0.98] transition-all">
          Validar Agora
        </button>
      </div>
      <div id="mensagemStatus" class="mt-4 text-xs font-semibold hidden"></div>
    </div>

  </main>

  <!-- Modal Admin / Gerador de Licenças -->
  <div id="modalAdmin" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 relative shadow-2xl">
      <button onclick="fecharModalAdmin()" class="absolute top-4 right-4 text-slate-500 hover:text-white">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
      
      <div class="text-center mb-6">
        <h2 class="text-xl font-bold text-white mb-1"><i class="fa-solid fa-user-gear text-purple-400 mr-2"></i>Gerador de Licenças</h2>
        <p class="text-xs text-slate-400">Crie novas chaves de acesso para seus clientes</p>
      </div>

      <div class="flex flex-col gap-4">
        <div>
          <label class="text-xs font-semibold text-slate-400 mb-1 block">Duração da Licença:</label>
          <select id="duracaoLicenca" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm focus:outline-none focus:border-purple-500">
            <option value="1 DIA">1 DIA (Teste)</option>
            <option value="7 DIAS">7 DIAS (Semanal)</option>
            <option value="30 DIAS">30 DIAS (Mensal)</option>
            <option value="PERMANENTE">PERMANENTE (Lifetime)</option>
          </select>
        </div>

        <button onclick="gerarNovaLicenca()" class="w-full py-3 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold text-sm transition-colors shadow-lg shadow-purple-600/30">
          ✨ Gerar Nova Chave
        </button>

        <div id="areaChaveGerada" class="hidden p-4 bg-slate-950 border border-purple-500/30 rounded-xl text-center">
          <span class="text-xs text-slate-400 block mb-1">Nova Chave Gerada com Sucesso:</span>
          <div id="textoChave" class="text-purple-300 font-mono font-bold text-base select-all"></div>
        </div>
      </div>
    </div>
  </div>

  <footer class="border-t border-slate-800/60 bg-[#080b12] py-6 text-center text-xs text-slate-500">
    <p>RAPOSO XITER &copy; 2026. Todos os direitos reservados.</p>
  </footer>

  <script>
    // Carrega chaves padrão + chaves salvas localmente
    function obterChaves() {
      const salvas = localStorage.getItem('raposo_keys');
      return salvas ? JSON.parse(salvas) : ['RAPOSO-VIP-2026', 'RAPOSO-TESTE-123'];
    }

    function validarChave() {
      const key = document.getElementById('licenseKey').value.trim();
      const msg = document.getElementById('mensagemStatus');
      msg.classList.remove('hidden', 'text-green-400', 'text-red-400');

      const chavesValidas = obterChaves();

      if (!key) {
        msg.textContent = '❌ Por favor, digite uma chave de licença.';
        msg.classList.add('text-red-400');
      } else if (chavesValidas.includes(key)) {
        msg.textContent = '✅ Licença VÁLIDA! Acesso liberado.';
        msg.classList.add('text-green-400');
      } else {
        msg.textContent = '❌ Licença INVÁLIDA ou EXPIRADA.';
        msg.classList.add('text-red-400');
      }
    }

    function abrirModalAdmin() {
      document.getElementById('modalAdmin').classList.remove('hidden');
    }

    function fecharModalAdmin() {
      document.getElementById('modalAdmin').classList.add('hidden');
    }

    function gerarNovaLicenca() {
      const duracao = document.getElementById('duracaoLicenca').value;
      const codigoAleatorio = Math.random().toString(36).substring(2, 8).toUpperCase();
      const novaChave = `RAPOSO-${duracao.replace(' ', '')}-${codigoAleatorio}`;

      // Salva a nova chave
      const chaves = obterChaves();
      chaves.push(novaChave);
      localStorage.setItem('raposo_keys', JSON.stringify(chaves));

      // Exibe na tela
      document.getElementById('textoChave').textContent = novaChave;
      document.getElementById('areaChaveGerada').classList.remove('hidden');
    }
  </script>
</body>
</html>
